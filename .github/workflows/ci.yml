name: Verify foundation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://apple:apple_dev_only@127.0.0.1:5432/apple_lab
      PROVIDER_MODE: mock
      RELEASE_ID: ci-${{ github.sha }}
      API_PORT: '3301'
      WEB_PORT: '8080'
      APP_ORIGIN: http://localhost:8080
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Start this lab database
        run: docker compose -f infra/compose.yaml up -d --wait db
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Build compiled API and web images
        run: docker compose -f infra/compose.yaml build api web
      - name: Start compiled lab stack
        run: docker compose -f infra/compose.yaml up -d --no-build --wait
      - name: Run E2E against compiled containers
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          PLAYWRIGHT_WEBKIT: '1'
      - name: Verify deployed browser and database readback
        run: node scripts/smoke-container.mjs
      - name: Reconcile browser evidence with PostgreSQL
        run: node scripts/check-database-facts.mjs
      - name: Keep compiled lab evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiled-lab-evidence-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            .artifacts/build-budget.json
            .artifacts/container-smoke.json
            .artifacts/persisted-flow-check.json
            .artifacts/container-desktop.png
            .artifacts/container-mobile.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Show lab log tail
        if: always()
        run: docker compose -f infra/compose.yaml logs --no-color --tail=100
      - name: Stop only this lab stack
        if: always()
        run: docker compose -f infra/compose.yaml down
